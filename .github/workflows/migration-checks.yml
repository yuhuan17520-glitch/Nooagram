name: Nooagram migration checks
on:
  push:
    branches: [nooagram-nagram-migration]
    paths:
      - '.github/workflows/migration-checks.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/signed-candidate.yml'
      - 'nooagram-version.json'
      - 'docs/releases/*.md'
      - 'Tools/check-nagram-migration.ps1'
      - 'Tools/nooagram-release.ps1'
      - 'Tools/test-nooagram-release.ps1'
      - 'Tools/ayu-privacy-history-regression/**'
      - 'Tools/pinned-settings-regression/**'
      - 'TMessagesProj/src/main/**'
      - 'TMessagesProj/src/test/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migration-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Initialize Java dependencies
        run: |
          git submodule update --init TMessagesProj/lib/jlatexmath TMessagesProj_Modules/media
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Validate upstream/version pin
        shell: pwsh
        run: ./Tools/check-nagram-migration.ps1
      - name: Validate release assets and publication guard in isolated fixtures
        shell: pwsh
        run: ./Tools/test-nooagram-release.ps1
      - name: Compile Java/Kotlin and run migration unit tests
        run: ./gradlew :TMessagesProj:testDebugUnitTest --tests 'com.radolyn.ayugram.*' --tests 'tw.nekomimi.nekogram.filters.*' --tests 'tw.nekomimi.nekogram.helpers.remote.*' --tests 'tw.nekomimi.nekogram.helpers.CloudSettingsHelperTest' --tests 'tw.nekomimi.nekogram.helpers.CloudStorageHelperTest' --tests 'tw.nekomimi.nekogram.settings.*' --tests 'org.telegram.messenger.NotificationDismissStateTest' --tests 'org.telegram.messenger.NotificationsControllerDismissTest' --tests 'org.telegram.messenger.car.CarVoiceAttachmentTest' --tests 'org.telegram.utils.localization.ProductBrandingLocalizationTest' --console=plain
      - name: Validate upstream proposal script without network or pushes
        run: node Tools/nagram-sync-regression/test.cjs
      - name: Validate release shrinking and reflection contracts without packaging
        run: |
          ./gradlew :TMessagesProj:minifyReleaseWithR8 --console=plain
          node Tools/check-ayu-release-dex.cjs
      - name: Integration regression probes
        shell: pwsh
        run: |
          ./TMessagesProj/src/test/run-preview-regressions.ps1
          ./Tools/ayu-privacy-history-regression/run.ps1
          ./Tools/media-regression/run.ps1
          ./Tools/pinned-settings-regression/run.ps1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-tests
          path: TMessagesProj/build/reports/tests/
