name: Sync NagramXF upstream release

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nooagram-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Rebase onto upstream release tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Nooagram
        uses: actions/checkout@v4
        with:
          ref: ayu
          fetch-depth: 0

      - name: Configure Git
        id: base
        run: |
          git config user.name "Nooagram Bot"
          git config user.email "actions@github.com"
          EXPECTED_SHA=$(git rev-parse refs/remotes/origin/ayu)
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          git remote add upstream https://github.com/Keeperorowner/NagramXF.git

      - name: Resolve upstream release tag
        id: tag
        run: |
          UPSTREAM_TAG=$(gh release view --repo Keeperorowner/NagramXF --json tagName --jq .tagName)
          [[ "$UPSTREAM_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          git fetch --no-tags upstream "refs/tags/${UPSTREAM_TAG}:refs/nooagram/upstream-release"
          UPSTREAM_SHA=$(git rev-parse 'refs/nooagram/upstream-release^{commit}')
          echo "tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${UPSTREAM_TAG}"

      - name: Check upstream release tag
        id: check
        env:
          UPSTREAM_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase Nooagram
        id: rebase
        if: steps.check.outputs.updated == 'true'
        continue-on-error: true
        env:
          UPSTREAM_SHA: ${{ steps.tag.outputs.sha }}
        run: git rebase "$UPSTREAM_SHA"

      - name: Report rebase conflict
        if: steps.check.outputs.updated == 'true' && steps.rebase.outcome == 'failure'
        run: |
          git diff --name-only --diff-filter=U > conflicts.txt
          {
            echo "Automatic rebase of Nooagram onto Keeperorowner/NagramXF release ${{ steps.tag.outputs.tag }} failed."
            echo
            echo "Conflicted files:"
            echo
            echo '```'
            cat conflicts.txt
            echo '```'
            echo
            echo "Upstream release tag: ${{ steps.tag.outputs.tag }}"
          } > issue-body.md
          if ! gh issue list --state open --search "Upstream rebase failed" | grep -q "Upstream rebase failed"; then
            gh issue create \
              --title "Upstream rebase failed" \
              --body-file issue-body.md \
              --label upstream-sync
          fi
          exit 1

      - name: Pin rebased upstream version
        if: steps.check.outputs.updated == 'true' && steps.rebase.outcome == 'success'
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ steps.tag.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          $source = Get-Content -LiteralPath nooagram-version.json -Raw | ConvertFrom-Json
          $source.upstream_tag = $env:UPSTREAM_TAG
          $source.upstream_commit = $env:UPSTREAM_SHA
          $source | ConvertTo-Json | Set-Content -LiteralPath nooagram-version.json -Encoding utf8
          git add -- nooagram-version.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "chore: pin upstream release $env:UPSTREAM_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to commit upstream version pin.' }
          } elseif ($LASTEXITCODE -ne 0) {
            throw 'Unable to inspect upstream version pin.'
          }

      - name: Push ayu
        if: steps.check.outputs.updated == 'true' && steps.rebase.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ steps.base.outputs.expected_sha }}
          UPSTREAM_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git push --atomic "--force-with-lease=refs/heads/ayu:${EXPECTED_SHA}" origin \
            HEAD:refs/heads/ayu "refs/nooagram/upstream-release:refs/tags/${UPSTREAM_TAG}"

      - name: Start Nooagram release build
        if: steps.check.outputs.updated == 'true' && steps.rebase.outcome == 'success'
        run: gh workflow run release.yml --ref ayu -f source_sha="$(git rev-parse HEAD)"
