name: Release Build

on:
  push:
    branches:
      - ayu
    paths-ignore:
      - '**.md'
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          append-timestamp: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install Cython
        run: pip install Cython==3.0.11

      - name: Configure build environment
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          if [ "$MEMORY_GB" -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi

      - name: Prepare signing
        env:
          NOOAGRAM_KEYSTORE_BASE64: ${{ secrets.NOOAGRAM_KEYSTORE_BASE64 }}
        run: printf '%s' "$NOOAGRAM_KEYSTORE_BASE64" | base64 -d > TMessagesProj/release.keystore

      - name: Prepare version
        run: |
          NOOAGRAM_RUN="${{ github.run_number }}"
          UPSTREAM_TAG=$(gh release view --repo Keeperorowner/NagramXF --json tagName --jq .tagName)
          APP_VERSION_NAME=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | head -n1 | tr -d '\r')
          NOOAGRAM_VERSION_CODE=$((125000000 + NOOAGRAM_RUN))
          NOOAGRAM_VERSION="1.0.3-${APP_VERSION_NAME}.${UPSTREAM_TAG}"
          sed -i "s#^def verName = .*#def verName = \"${NOOAGRAM_VERSION}\"#" TMessagesProj/build.gradle
          sed -i "s#^def verCode = .*#def verCode = ${NOOAGRAM_VERSION_CODE}#" TMessagesProj/build.gradle
          {
            echo "APP_VERSION_NAME=${APP_VERSION_NAME}"
            echo "UPSTREAM_TAG=${UPSTREAM_TAG}"
            echo "NOOAGRAM_RUN=${NOOAGRAM_RUN}"
            echo "NOOAGRAM_VERSION_CODE=${NOOAGRAM_VERSION_CODE}"
            echo "NOOAGRAM_VERSION=${NOOAGRAM_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          BUILD_TIMESTAMP: ${{ vars.NOOAGRAM_BUILD_TIMESTAMP }}
        run: |
          export BUILD_TIMESTAMP="${BUILD_TIMESTAMP:-$(date +%s)}"
          export COMMIT_ID="${GITHUB_SHA}"
          ./gradlew TMessagesProj:assembleNormalRelease --build-cache

      - name: Collect APKs
        run: |
          OUT="TMessagesProj/build/outputs/apk/normal/release"
          APK64_PATH=$(find "$OUT" -name '*arm64-v8a*.apk' -print -quit)
          APK32_PATH=$(find "$OUT" -name '*armeabi-v7a*.apk' -print -quit)
          if [ -z "$APK64_PATH" ]; then
            echo "No arm64-v8a APK found" >&2
            exit 1
          fi
          VERSION="${{ env.NOOAGRAM_VERSION }}"
          cp "$APK64_PATH" "Nooagram-v${VERSION}-arm64-v8a.apk"
          if [ -n "$APK32_PATH" ]; then
            cp "$APK32_PATH" "Nooagram-v${VERSION}-armeabi-v7a.apk"
          fi
          sha256sum "Nooagram-v${VERSION}-arm64-v8a.apk" > SHA256SUMS.txt
          {
            echo "APK64=Nooagram-v${VERSION}-arm64-v8a.apk"
            if [ -n "$APK32_PATH" ]; then
              echo "APK32=Nooagram-v${VERSION}-armeabi-v7a.apk"
            fi
          } >> "$GITHUB_ENV"

      - name: Publish GitHub release
        run: |
          VERSION="${{ env.NOOAGRAM_VERSION }}"
          TAG="v${VERSION}"
          CHANGELOG_SUBJECT=$(git log -1 --format='%s')
          {
            echo "## Nooagram ${VERSION}"
            echo
            echo "- NagramXF release tag: ${{ env.UPSTREAM_TAG }}"
            echo "- ${CHANGELOG_SUBJECT}"
          } > release-notes.md
          ASSETS=("${{ env.APK64 }}")
          if [ -n "${{ env.APK32 }}" ]; then
            ASSETS+=("${{ env.APK32 }}")
          fi
          publish_release() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${ASSETS[@]}" SHA256SUMS.txt --clobber
              gh release edit "$TAG" --notes-file release-notes.md
            else
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "Nooagram ${VERSION}" \
                --notes-file release-notes.md \
                "${ASSETS[@]}" SHA256SUMS.txt
            fi
          }
          published=0
          for attempt in 1 2 3 4 5; do
            if publish_release; then
              published=1
              break
            fi
            echo "GitHub release publish failed (attempt ${attempt}); retrying after server error."
            sleep "$((attempt * 15))"
          done
          if [ "$published" -ne 1 ]; then
            echo "GitHub release publish failed after 5 attempts." >&2
            exit 1
          fi

      - name: Publish update manifest
        run: |
          VERSION="${{ env.NOOAGRAM_VERSION }}"
          TAG="v${VERSION}"
          APK64="${{ env.APK64 }}"
          APK32="${{ env.APK32 }}"
          SHA256=$(sha256sum "$APK64" | awk '{print $1}')
          CHANGELOG=$(git log -1 --format='%s')
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"
          export VERSION NOOAGRAM_VERSION_CODE SHA256 CHANGELOG BASE_URL APK64 APK32
          python3 - <<'PY'
          import json
          import os
          import urllib.parse

          manifest = {
              "version": os.environ["VERSION"],
              "version_code": int(os.environ["NOOAGRAM_VERSION_CODE"]),
              "timestamp": int(__import__("time").time()),
              "can_not_skip": False,
              "changelog": os.environ["CHANGELOG"],
              "download_url": os.environ["BASE_URL"] + urllib.parse.quote(os.environ["APK64"]),
              "sha256": os.environ["SHA256"],
          }
          if os.environ.get("APK32"):
              manifest["download_url_32"] = os.environ["BASE_URL"] + urllib.parse.quote(os.environ["APK32"])

          with open("update.json", "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, ensure_ascii=False, indent=2)
          PY
          upload_manifest() {
            gh release upload "$TAG" update.json --clobber
          }
          manifest_uploaded=0
          for attempt in 1 2 3 4 5; do
            if upload_manifest; then
              manifest_uploaded=1
              break
            fi
            echo "Update manifest upload failed (attempt ${attempt}); retrying after server error."
            sleep "$((attempt * 15))"
          done
          if [ "$manifest_uploaded" -ne 1 ]; then
            echo "Update manifest upload failed after 5 attempts." >&2
            exit 1
          fi
