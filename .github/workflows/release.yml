name: Release Build

on:
  push:
    branches:
      - ayu
    paths-ignore:
      - '**.md'
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact rebased commit to build (set by upstream sync)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nooagram-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Fetch pinned upstream tag
        run: |
          TAG=$(sed -n 's/.*"upstream_tag"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' nooagram-version.json)
          COMMIT=$(sed -n 's/.*"upstream_commit"[[:space:]]*:[[:space:]]*"\([0-9a-f]*\)".*/\1/p' nooagram-version.json)
          test -n "$TAG" && test -n "$COMMIT"
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          append-timestamp: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install Cython
        run: pip install Cython==3.0.11

      - name: Configure build environment
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          if [ "$MEMORY_GB" -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi

      - name: Prepare signing
        env:
          NOOAGRAM_KEYSTORE_BASE64: ${{ secrets.NOOAGRAM_KEYSTORE_BASE64 }}
        run: printf '%s' "$NOOAGRAM_KEYSTORE_BASE64" | base64 -d > TMessagesProj/release.keystore

      - name: Prepare version
        shell: pwsh
        run: |
          . ./Tools/nooagram-release.ps1
          $version = Get-NooagramVersion -RepositoryPath . -RunNumber ([long]$env:GITHUB_RUN_NUMBER)
          $version | ConvertTo-Json | Set-Content -LiteralPath release-version.json -Encoding utf8
          @(
            "UPSTREAM_TAG=$($version.UpstreamTag)"
            "NOOAGRAM_VERSION_CODE=$($version.VersionCode)"
            "NOOAGRAM_VERSION_NAME=$($version.VersionName)"
            "COMMIT_ID=$($version.Commit)"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Test release metadata
        shell: pwsh
        run: ./Tools/test-nooagram-release.ps1

      - name: Test normal debug regressions
        run: ./gradlew :TMessagesProj:testNormalDebugUnitTest

      - name: Build release APKs
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          BUILD_TIMESTAMP: ${{ vars.NOOAGRAM_BUILD_TIMESTAMP }}
        run: |
          export BUILD_TIMESTAMP="${BUILD_TIMESTAMP:-$(date +%s)}"
          ./gradlew TMessagesProj:assembleNormalRelease --build-cache

      - name: Collect APKs
        shell: pwsh
        run: |
          . ./Tools/nooagram-release.ps1
          $version = Get-Content -LiteralPath release-version.json -Raw | ConvertFrom-Json
          $timestamp = [long](git show -s --format=%ct HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read build timestamp.' }
          $changelog = git log -1 --format=%s
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read changelog.' }
          Export-NooagramReleaseAssets -OutputDirectory TMessagesProj/build/outputs/apk/normal/release `
            -Destination release-assets -Repository $env:GITHUB_REPOSITORY -Version $version `
            -Timestamp $timestamp -Changelog $changelog

      - name: Publish GitHub release
        run: |
          VERSION="$NOOAGRAM_VERSION_NAME"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing release: $TAG" >&2
            exit 1
          fi
          # Concurrency is not FIFO: never make a lower versionCode the latest release.
          LATEST_TAG=$(gh release view --json tagName --jq .tagName)
          mkdir previous-release
          gh release download "$LATEST_TAG" --pattern update.json --dir previous-release
          PREVIOUS_CODE=$(jq -er '.version_code | numbers' previous-release/update.json)
          if [ "$NOOAGRAM_VERSION_CODE" -le "$PREVIOUS_CODE" ]; then
            echo "Version code must exceed the latest release ($PREVIOUS_CODE); raise version_code_floor." >&2
            exit 1
          fi
          CHANGELOG_SUBJECT=$(git log -1 --format='%s')
          {
            echo "## Nooagram ${VERSION}"
            echo
            echo "- NagramXF release tag: $UPSTREAM_TAG"
            echo "- Build commit: $COMMIT_ID"
            echo "- ${CHANGELOG_SUBJECT}"
          } > release-notes.md
          gh release create "$TAG" --draft \
            --target "$COMMIT_ID" \
            --title "Nooagram ${VERSION}" \
            --notes-file release-notes.md \
            release-assets/*.apk release-assets/SHA256SUMS.txt release-assets/update.json
          gh release edit "$TAG" --draft=false --latest
